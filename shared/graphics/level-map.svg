<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="60" y="70" fill="#f5f5f5" font-size="34" font-weight="700">AI Fluency Program — Five Levels</text>
  <text x="60" y="100" fill="#9ca3af" font-size="16">Novice → Operator → Practitioner → Contributor</text>

  <!-- Path line -->
  <path d="M 100 400 Q 300 200, 500 380 T 900 300 T 1140 200" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow)"/>

  <!-- Level 1 -->
  <g transform="translate(80,340)">
    <circle cx="0" cy="0" r="46" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#f97316" font-size="22" font-weight="800">1</text>
    <text x="0" y="80" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">Essentials</text>
    <text x="0" y="100" text-anchor="middle" fill="#9ca3af" font-size="12">30 days</text>
    <text x="0" y="118" text-anchor="middle" fill="#9ca3af" font-size="12">Novice</text>
  </g>

  <!-- Level 2 -->
  <g transform="translate(320,220)">
    <circle cx="0" cy="0" r="48" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#f97316" font-size="22" font-weight="800">2</text>
    <text x="0" y="82" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">Intermediate</text>
    <text x="0" y="102" text-anchor="middle" fill="#9ca3af" font-size="12">60–90 days</text>
    <text x="0" y="120" text-anchor="middle" fill="#9ca3af" font-size="12">Builder</text>
  </g>

  <!-- Level 3 -->
  <g transform="translate(600,380)">
    <circle cx="0" cy="0" r="50" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#f97316" font-size="22" font-weight="800">3</text>
    <text x="0" y="86" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">Advanced</text>
    <text x="0" y="106" text-anchor="middle" fill="#9ca3af" font-size="12">4–6 months</text>
    <text x="0" y="124" text-anchor="middle" fill="#9ca3af" font-size="12">Systems Designer</text>
  </g>

  <!-- Level 4 -->
  <g transform="translate(880,290)">
    <circle cx="0" cy="0" r="52" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#f97316" font-size="22" font-weight="800">4</text>
    <text x="0" y="88" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">Professional</text>
    <text x="0" y="108" text-anchor="middle" fill="#9ca3af" font-size="12">6–12 months</text>
    <text x="0" y="126" text-anchor="middle" fill="#9ca3af" font-size="12">Practitioner</text>
  </g>

  <!-- Level 5 -->
  <g transform="translate(1120,190)">
    <circle cx="0" cy="0" r="54" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#f97316" font-size="22" font-weight="800">5</text>
    <text x="0" y="90" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">Frontier</text>
    <text x="0" y="110" text-anchor="middle" fill="#9ca3af" font-size="12">Ongoing</text>
    <text x="0" y="128" text-anchor="middle" fill="#9ca3af" font-size="12">Contributor</text>
  </g>

  <!-- Two tracks legend -->
  <g transform="translate(60,560)">
    <text x="0" y="0" fill="#f5f5f5" font-size="14" font-weight="700">Two tracks at every level</text>
    <circle cx="12" cy="24" r="6" fill="#f97316"/>
    <text x="28" y="28" fill="#e5e7eb" font-size="13">Individual — your personal capability</text>
    <circle cx="12" cy="48" r="6" fill="#f59e0b"/>
    <text x="28" y="52" fill="#e5e7eb" font-size="13">Company — organizational capability</text>
  </g>

  <g transform="translate(500,560)">
    <text x="0" y="0" fill="#f5f5f5" font-size="14" font-weight="700">Two voices at every level</text>
    <circle cx="12" cy="24" r="6" fill="#f97316"/>
    <text x="28" y="28" fill="#e5e7eb" font-size="13">Standard docs — for builders</text>
    <circle cx="12" cy="48" r="6" fill="#f59e0b"/>
    <text x="28" y="52" fill="#e5e7eb" font-size="13">ELI10 companions — for everyone else</text>
  </g>

  <text x="60" y="670" fill="#6b7280" font-size="12">Not linear — you can be Level 3 on RAG and Level 2 on agents at the same time.</text>
</svg>
