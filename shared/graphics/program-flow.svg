<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#141820"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg3)"/>

  <text x="60" y="70" fill="#f5f5f5" font-size="32" font-weight="700">How to Use This Program</text>
  <text x="60" y="100" fill="#9ca3af" font-size="15">Read the cover letter → assess your level → work the sequence → repeat</text>

  <!-- Boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- 1 Read -->
    <g transform="translate(80,180)">
      <rect width="220" height="130" rx="12" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f97316" font-size="12" font-weight="700">STEP 1</text>
      <text x="20" y="65" fill="#f5f5f5" font-size="18" font-weight="700">Read the letter</text>
      <text x="20" y="90" fill="#9ca3af" font-size="12">shared/cover-letter/</text>
      <text x="20" y="108" fill="#9ca3af" font-size="12">short + field guide</text>
    </g>

    <!-- Arrow -->
    <path d="M 305 245 L 340 245" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 2 Assess -->
    <g transform="translate(345,180)">
      <rect width="220" height="130" rx="12" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f97316" font-size="12" font-weight="700">STEP 2</text>
      <text x="20" y="65" fill="#f5f5f5" font-size="18" font-weight="700">Assess your level</text>
      <text x="20" y="90" fill="#9ca3af" font-size="12">LEVEL-MAP.md</text>
      <text x="20" y="108" fill="#9ca3af" font-size="12">Where you are, where next</text>
    </g>

    <path d="M 570 245 L 605 245" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 3 Sequence -->
    <g transform="translate(610,180)">
      <rect width="220" height="130" rx="12" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f97316" font-size="12" font-weight="700">STEP 3</text>
      <text x="20" y="65" fill="#f5f5f5" font-size="18" font-weight="700">Work the sequence</text>
      <text x="20" y="90" fill="#9ca3af" font-size="12">level-N/00-start-here/</text>
      <text x="20" y="108" fill="#9ca3af" font-size="12">Day-by-day plan</text>
    </g>

    <path d="M 835 245 L 870 245" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 4 Level up -->
    <g transform="translate(875,180)">
      <rect width="220" height="130" rx="12" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f97316" font-size="12" font-weight="700">STEP 4</text>
      <text x="20" y="65" fill="#f5f5f5" font-size="18" font-weight="700">Hit exit criteria</text>
      <text x="20" y="90" fill="#9ca3af" font-size="12">Then move up a level</text>
      <text x="20" y="108" fill="#9ca3af" font-size="12">Repeat until Level 5</text>
    </g>
  </g>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Support layer -->
  <g transform="translate(80,400)">
    <text x="0" y="0" fill="#f5f5f5" font-size="18" font-weight="700">Every step has two supports</text>

    <g transform="translate(0,40)">
      <rect width="510" height="180" rx="12" fill="#1f2937" stroke="#374151"/>
      <text x="24" y="40" fill="#f97316" font-size="14" font-weight="700">ELI10 COMPANIONS</text>
      <text x="24" y="70" fill="#e5e7eb" font-size="14">Every concept has a plain-language explainer.</text>
      <text x="24" y="94" fill="#9ca3af" font-size="13">If a doc feels dense, open its ELI10 twin first.</text>
      <text x="24" y="118" fill="#9ca3af" font-size="13">Location: level-N/eli10/</text>
      <text x="24" y="152" fill="#9ca3af" font-size="12">Written for a curious 10-year-old, a busy exec, or a</text>
      <text x="24" y="168" fill="#9ca3af" font-size="12">non-technical partner. Uses everyday analogies.</text>
    </g>

    <g transform="translate(540,40)">
      <rect width="510" height="180" rx="12" fill="#1f2937" stroke="#374151"/>
      <text x="24" y="40" fill="#f97316" font-size="14" font-weight="700">TWO TRACKS</text>
      <text x="24" y="70" fill="#e5e7eb" font-size="14">Individual and Company at every level.</text>
      <text x="24" y="94" fill="#9ca3af" font-size="13">Individual: your personal capability.</text>
      <text x="24" y="118" fill="#9ca3af" font-size="13">Company: what an org must build alongside.</text>
      <text x="24" y="152" fill="#9ca3af" font-size="12">Use both together, or pick the track that fits</text>
      <text x="24" y="168" fill="#9ca3af" font-size="12">your role right now.</text>
    </g>
  </g>

  <text x="60" y="670" fill="#6b7280" font-size="12">Loop: you never fully finish. Every level is refreshed quarterly as the field moves.</text>
</svg>
